spring:
  application:
    name: AUTH-SERVICE

  # DATABASE
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

server:
    port: 8282

# EUREKA
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# SWAGGER
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls-primary-name: gateway-service
  api-docs:
    path: /v3/api-docs
    enabled: true