version: '3.8'

services:
  # ----------------------------------------
  # Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dfd_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dfd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Spring Cloud Infrastructure
  # ----------------------------------------
  service-registry:
    build:
      context: ./service-registry # Substitua pelo caminho real da pasta do Eureka
      dockerfile: Dockerfile
    container_name: service_registry
    ports:
      - "8761:8761" # Porta padrão do painel do Eureka (opcional para visualização local)
    restart: always

  api-gateway:
    build:
      context: ./api-gateway # Substitua pelo caminho real da pasta do Gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "5000:9191" # Mapeia a 5000 da sua máquina para a porta interna do Gateway (geralmente 8080 no Spring)
    depends_on:
      - service-registry
    restart: always
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ----------------------------------------
  # Domain Services
  # ----------------------------------------
  dfd-service:
    build:
      context: ./dfd-service # Substitua pelo caminho real da pasta do microsserviço
      dockerfile: Dockerfile
    container_name: dfd_service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: always
    environment:
      # Conexão com o Postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dfd_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update # ou validate, dependendo da sua estratégia
      # Registro no Eureka
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ----------------------------------------
  # Frontend
  # ----------------------------------------
  frontend:
    build:
      context: ./ThreatModelDfdView
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000"
    container_name: dfd_frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: always

volumes:
  postgres_data: