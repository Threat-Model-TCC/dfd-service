server:
  port: 9191

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: AUTH-SERVICE
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            
            - id: DFD-SERVICE
              uri: lb://DFD-SERVICE
              predicates:
                - Path=/dfd/**, /projects/**

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG